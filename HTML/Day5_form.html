<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Document</title>
</head>
<body>
    <fieldset><legend>Registration Form</legend>
        <!-- <h1>Registration Form</h1> -->

        <form action="">
        <label for="name"><span style="color: red;">*</span>Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Name" required><br><br>

        <label for="email"><span style="color: red;">*</span>Email:</label>
        <input type="email" id="email" name="email" required><br><br> 
        
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="Password"><span style="color: red;">*</span>Password:</label>
        <input type="password" id="Password" name="Password" required><br><br>

        <label for="confirmPassword"><span style="color: red;">*</span>Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">Male
        <!-- <label for="male">Male</label> -->
        <input type="radio" id="female" name="gender" value="female">Female
        <!-- <label for="female">Female</label><br><br> -->
        <br><br>
        
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="">Select a country</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select><br><br>
        
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>

        <label for="Course">Course:</label>
        <!-- <input type="checkbox" id="course1" name="course" value="course1"> -->
        <!-- <label for="course1">Course 1</label> -->
        <!-- <input type="checkbox" id="course2" name="course" value="course2"> -->
        <!-- <label for="course2">Course 2</label> -->
        <!-- <input type="checkbox" id="course3" name="course" value="course3"> -->
        <!-- <label for="course3">Course 3</label><br><br> -->

        <input type="checkbox">WD
        <input type="checkbox">AI
        <input type="checkbox">SQL
        <input type="checkbox">DS
        <input type="checkbox">C
        <input type="checkbox">Cyber Security
        <br><br>

        <label for="Sign">Upload File:</label>
        <input type="file" id="Sign" name="Sign"><br><br>

        <!-- <input type="submit" value="Submit"> -->
        <button type="submit">Submit</button>

    </form>
    </fieldset>
</body>
</html>
