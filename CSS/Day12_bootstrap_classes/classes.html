<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>

    <!-- navbar -->
    <nav class="navbar navbar-expand bg-secondary">
        <article class="container-fluid">
            <a href="#" title="Home"><i class="fa-solid fa-house"></i></a>
            <a href="" title="About"><i class="fa-solid fa-circle-info"></i></a>
            <a href="" title="Services"><i class="fa-brands fa-yelp"></i></a>
            <a href="#" title="Contact"><i class="fa-solid fa-phone"></i></a>
        </article>
    </nav>

    <!-- Alert -->
    <div class="alert alert-danger alert-dismissible">
        <strong>This is warning.. Please close this tab</strong>
        <button class="btn btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Button -->
     <button class="btn btn-primary">Click me</button>
     <button class="btn btn-warning">Submit</button>
     <button class="btn btn-outline-success">Login</button>


    <!-- table -->
    <table class="table table-striped table-hover table-bordered table-dark">
        <tr class="table-light">
            <td>Name</td>
            <td>ID</td>
            <td>City</td>
            <td>Contact</td>
        </tr>
        <tr class="table-warning">
            <td>Vaishnavi</td>
            <td>101</td>
            <td>Karad</td>
            <td>8567890324</td>
        </tr>
        <tr class="table-success">
            <td>Rutuja</td>
            <td>102</td>
            <td>Pune</td>
            <td>8567893456</td>
        </tr>
    </table>

    <!-- form -->
     <div class="mb-4">
        <label for="" class="form-label">Username:</label>
        <input type="text" class="form-control-lg">
     </div>
     <div class="mb-3">
        <label for="" class="form-label">Password:</label>
        <input type="password" class="form-control-sm">
     </div>
     <button class="btn btn-outline-success">Submit</button>

     <!-- image -->
      <img src="https://i.pinimg.com/236x/af/2d/f1/af2df1df054b299e8da44a783f4cf729.jpg" alt="" height="400px" class="rounded">
      <img src="https://i.pinimg.com/236x/af/2d/f1/af2df1df054b299e8da44a783f4cf729.jpg" alt="" height="400px" class="rounded-circle">
      <img src="https://i.pinimg.com/236x/af/2d/f1/af2df1df054b299e8da44a783f4cf729.jpg" alt="" height="300px" width="400px" class="img-thumbnail">
      <img src="https://i.pinimg.com/236x/af/2d/f1/af2df1df054b299e8da44a783f4cf729.jpg" alt="" class="img-fluid w-100">

    <!-- Spinner -->
    <div class="spinner-border text-success"></div><span>Loading...</span>
    <div class="spinner-grow text-primary"></div>

    <!-- Progress bar- datatype=range -->
     <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:80%"></div>
     </div>

    <!-- corousel - creates slideshow component--> 
     <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner mt-5">

        <div class="carousel-item active">
            <img src="https://picsum.photos/id/1015/1200/500" alt="Nature">
            <div class="carousel-caption">
                <h3>Nature</h3>
                <p>Beautiful Mountains</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1018/1200/500" alt="Dog" w-100>

            <div class="carousel-caption">
                <h3>Forest</h3>
                <p>Explore Nature</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1025/1200/500" alt="Forest">

            <div class="carousel-caption">
                <h3>Dog</h3>
                <p>Hey Doggy</p>
            </div>
        </div>

    </div>

    <!-- Previous Button -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#myCarousel"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <!-- Next Button -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#myCarousel"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>
    
</body>
</html>
