<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        /* internal CSS can be written in head or body but priority give to head */
        h1{
            color: bisque;
        }
    </style>
</head>
<body>
    <!-- Always priority gives to inline then internal and then external CSS that's why here h1 takes color giiven in inline CSS -->
    <h1 style="color:darkmagenta">Welcome to CSS</h1>
    <p style="color: red;">CSS is Cascading Style Sheet</p>

</body>
</html>
