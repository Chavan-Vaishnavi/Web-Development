<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Navbar </title>

    <link rel="stylesheet" href="flipkart.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>

    <!-- Top Navbar -->
    <nav class="top-nav">

        <!-- Left -->
        <div class="left">

            <div class="logo">
                <img src="https://static-assets-web.flixcart.com/batman-returns/batman-returns/p/images/flipkart-095e08.svg">
            </div>

            <div class="travel"><i class="fa-solid fa-plane"></i>
                <span>Travel</span>
            </div>
        </div>

        <!-- Middle -->
        <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
            <input type="text"
            placeholder="Search for Products, Brands and More">
        </div>

        <!-- Right -->
        <div class="right">

            <div class="location"><i class="fa-solid fa-location-dot"></i>Location not set</div>
            <div class="login"><i class="fa-regular fa-user"></i>Login</div>
            <div class="more">More<i class="fa-solid fa-angle-down"></i></div>
            <div class="cart"><i class="fa-solid fa-cart-shopping"></i>Cart</div>
        </div>
    </nav>

    <!-- Bottom Menu -->

    <div class="menu">

        <div class="item">
            <i class="fa-solid fa-shirt"></i>
            <p>Fashion</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-mobile-screen"></i>
            <p>Mobiles</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-tv"></i>
            <p>Electronics</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-heart"></i>
            <p>Beauty</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-house"></i>
            <p>Home</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-laptop"></i>
            <p>Appliances</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-puzzle-piece"></i>
            <p>Toys</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-bowl-food"></i>
            <p>Food</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-car"></i>
            <p>Auto</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-futbol"></i>
            <p>Sports</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-couch"></i>
            <p>Furniture</p>
        </div>

        <div class="item">
            <i class="fa-solid fa-book"></i>
            <p>Books</p>
        </div>

    </div>

</header>

</body>
</html>
