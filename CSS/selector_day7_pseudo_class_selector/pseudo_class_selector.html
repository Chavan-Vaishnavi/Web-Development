<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class selector Document</title>
    <link rel="stylesheet" href="./pseudo_class_selector.css">
</head>
<body>
    <h1>Welcome</h1>
    <!-- Button turns blue when the mouse is over it. -->
     <!-- Button turns red while being clicked. -->
    <button>Hello</button>      
    <p>Find here all you want</p>
    <div>
        <p class="special">Information</p>
        <p>Homepage</p>
        <!-- Textbox gets a green border when selected. -->
        <input type="text" name="Fullname:">
        <br>
        <!-- Unvisited Flipkart link appears blue. -->
         <!-- After opening the link once, it appears purple. -->
        <a href="https://www.flipkart.com/" target="_blank">Visit Flipkart</a>
        <ul>
            <!-- Mango becomes red and bold. -->
            <li>Mango</li>
            <!-- Apple becomes blue and larger. -->
            <li>Apple</li>
            <!-- Pineapple becomes green and italic. -->
            <li>Pineapple</li>
        </ul>
        <!-- Checked checkbox appears green and larger. -->
        <input type="checkbox" checked>I Agree
        <br>
        <!-- Disabled input appears gray and cannot be edited. -->
        <input type="text" placeholder="Disabled input" disabled>
    </div>
</body>
</html>
